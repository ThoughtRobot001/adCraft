<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdCraft — AI Creative Studio for Motion Advertisements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #07080C;
        color: #F8FAFC;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error("Window Error:", msg, url, lineNo, error);
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:40px;color:#F43F5E;background:#0B0D11;min-height:100vh;font-family:monospace;z-index:999999;position:relative;"><h2>🚨 Script Error</h2><pre style="white-space:pre-wrap;background:rgba(244,63,94,0.1);padding:16px;border-radius:8px;border:1px solid rgba(244,63,94,0.3);">' + (error ? (error.stack || error.message) : msg) + '\nAt: ' + url + ':' + lineNo + '</pre></div>';
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        console.error("Unhandled Rejection:", event.reason);
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="padding:40px;color:#F43F5E;background:#0B0D11;min-height:100vh;font-family:monospace;z-index:999999;position:relative;"><h2>🚨 Unhandled Promise Rejection</h2><pre style="white-space:pre-wrap;background:rgba(244,63,94,0.1);padding:16px;border-radius:8px;border:1px solid rgba(244,63,94,0.3);">' + (event.reason ? (event.reason.stack || event.reason.message) : event.reason) + '</pre></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#64748B;font-family:'Inter',sans-serif;font-size:14px;letter-spacing:0.5px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
          <div style="width:28px;height:28px;border:2px solid rgba(139,92,246,0.3);border-top-color:#8B5CF6;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
          <span>Loading AdCraft Studio...</span>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
